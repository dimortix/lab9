[pytest]
# Корень тестов — каталог tests/ внутри CI-репозитория.
testpaths = tests
# Каталоги, добавляемые в sys.path: нужно, чтобы модули тестов могли
# импортировать общий conftest.py своего набора (tests/api, tests/ui).
pythonpath = . tests/api tests/ui
# -ra: краткая сводка причин пропусков и падений в конце прогона.
addopts = -v -ra --strict-markers --durations=10
markers =
    unit: модульные тесты (без браузера и сети)
    api: тесты REST API (нужен интернет или локальный мок)
    ui: UI-тесты Selenium (нужен Chrome и ChromeDriver)
