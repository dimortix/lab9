name: run-tests

# Когда запускается workflow:
#   * push в основную ветку и в любую ветку вида feature/**;
#   * pull request в main;
#   * вручную из вкладки Actions (workflow_dispatch).
on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# По умолчанию у workflow только права на чтение — этого достаточно,
# чтобы забрать код и запустить тесты.
permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Джоба 1: модульные тесты (быстрые, без сети и браузера).
  # -------------------------------------------------------------------------
  unit-tests:
    name: Модульные тесты (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Получение кода репозитория
        uses: actions/checkout@v4

      - name: Установка Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Прогон модульных тестов с покрытием
        run: pytest tests/unit -m unit --cov=src --cov-report=term-missing --cov-report=xml

      - name: Сохранение отчёта о покрытии
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # Джоба 2: тесты REST API. Сначала пробуем публичное API, при недоступности
  # поднимаем локальный мок-сервер — тесты должны пройти в любом случае.
  # -------------------------------------------------------------------------
  api-tests:
    name: Тесты REST API
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Получение кода репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Проверка доступности публичного API
        id: probe
        run: |
          if curl -sf --max-time 10 https://jsonplaceholder.typicode.com/users/1 > /dev/null; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
            echo "Публичное API доступно — тесты пойдут против него."
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "Публичное API недоступно — поднимаю локальный мок."
          fi

      - name: Запуск локального мока (если нет интернета)
        if: steps.probe.outputs.reachable == 'false'
        run: |
          nohup python mock_server/app.py > mock_server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8090/users/1 > /dev/null && break
            sleep 0.5
          done

      - name: Прогон тестов API
        env:
          API_BASE_URL: ${{ steps.probe.outputs.reachable == 'false' && 'http://127.0.0.1:8090' || '' }}
        run: pytest tests/api -m api

      - name: Лог мок-сервера (при ошибке)
        if: failure() && steps.probe.outputs.reachable == 'false'
        run: cat mock_server.log

  # -------------------------------------------------------------------------
  # Джоба 3: UI-тесты Selenium в headless-режиме.
  # -------------------------------------------------------------------------
  ui-tests:
    name: UI-тесты (Selenium, headless Chrome)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Получение кода репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Версии Chrome и ChromeDriver
        run: |
          google-chrome --version || chromium --version
          chromedriver --version || true

      - name: Прогон UI-тестов
        env:
          # Selenium Manager сам скачает подходящий ChromeDriver в CI.
          HEADLESS: '1'
        run: pytest tests/ui -m ui

      - name: Скриншоты упавших тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: tests/ui/screenshots/
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # Джоба 4: итоговая проверка. Джоба нужна как единая «зелёная галочка»
  # в интерфейсе GitHub: если хоть один набор тестов упал — она не пройдёт.
  # -------------------------------------------------------------------------
  all-tests:
    name: "Итог: все тесты пройдены"
    runs-on: ubuntu-latest
    needs: [unit-tests, api-tests, ui-tests]
    if: always()

    steps:
      - name: Проверка результатов предыдущих джоб
        run: |
          echo "unit-tests: ${{ needs.unit-tests.result }}"
          echo "api-tests:  ${{ needs.api-tests.result }}"
          echo "ui-tests:   ${{ needs.ui-tests.result }}"
          if [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.api-tests.result }}"  != "success" ] || \
             [ "${{ needs.ui-tests.result }}"   != "success" ]; then
            echo "::error::Хотя бы один набор тестов не прошёл — сборка красная."
            exit 1
          fi
          echo "Все наборы тестов прошли успешно."
